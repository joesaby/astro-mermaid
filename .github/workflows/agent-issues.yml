name: Agent - Issues

# Phase 1: label and comment only. The issue manager never closes issues.
# See .claude/skills/triage-issues/SKILL.md.

on:
  issues:
    types: [opened]
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC: weekly grooming
  workflow_dispatch:

concurrency:
  group: agent-issues-${{ github.event.issue.number || 'weekly' }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name != 'issues' || !endsWith(github.event.issue.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ${{ github.event.issue.number && format('ISSUE NUMBER: {0}', github.event.issue.number) || 'MODE: weekly grooming' }}

            Use the triage-issues skill. With an issue number, triage that issue; otherwise run the weekly grooming pass.
          claude_args: >-
            --allowedTools "Skill,Task,Agent,Read,Grep,Glob,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh label list:*),Bash(gh label create:*),Bash(gh search issues:*)"
            --disallowedTools "Bash(gh issue close:*),Bash(gh issue delete:*),Bash(gh issue lock:*),Bash(gh issue transfer:*)"

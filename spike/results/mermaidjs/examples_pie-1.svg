<svg id="m160" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630.125 450" style="max-width: 630.125px;" role="graphics-document document" aria-roledescription="pie"><style>#m160{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m160 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m160 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m160 .error-icon{fill:#552222;}#m160 .error-text{fill:#552222;stroke:#552222;}#m160 .edge-thickness-normal{stroke-width:1px;}#m160 .edge-thickness-thick{stroke-width:3.5px;}#m160 .edge-pattern-solid{stroke-dasharray:0;}#m160 .edge-thickness-invisible{stroke-width:0;fill:none;}#m160 .edge-pattern-dashed{stroke-dasharray:3;}#m160 .edge-pattern-dotted{stroke-dasharray:2;}#m160 .marker{fill:#333333;stroke:#333333;}#m160 .marker.cross{stroke:#333333;}#m160 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#m160 p{margin:0;}#m160 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#m160 .pieCircle.highlighted{scale:1.05;opacity:1;}#m160 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#m160 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#m160 .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#m160 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#m160 .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#m160 .node .neo-node{stroke:#9370DB;}#m160 [data-look="neo"].node rect,#m160 [data-look="neo"].cluster rect,#m160 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m160 [data-look="neo"].swimlane.cluster rect{filter:none;}#m160 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#m160 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m160 [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#m160 [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m160 [data-look="neo"].node circle .state-start{fill:#000000;}#m160 [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m160 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m160 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,83.988,164.836L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M83.988,164.836A185,185,0,0,1,-158.041,96.166L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-158.041,96.166A185,185,0,0,1,-169.785,-73.472L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><path d="M-169.785,-73.472A185,185,0,0,1,-93.17,-159.826L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"></path><path d="M-93.17,-159.826A185,185,0,0,1,-31.234,-182.344L0,0Z" fill="hsl(60, 100%, 63.5294117647%)" class="pieCircle"></path><path d="M-31.234,-182.344A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 76.2745098039%)" class="pieCircle"></path><text transform="translate(134.91632645517763,-32.39054423500684)" class="slice" style="text-anchor: middle;">43%</text><text transform="translate(-37.87208105302894,133.4813394325694)" class="slice" style="text-anchor: middle;">24%</text><text transform="translate(-138.41873525762,9.582078567873717)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-103.78913459784424,-92.08353837375371)" class="slice" style="text-
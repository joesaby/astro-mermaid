<svg id="m196" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574.375 450" style="max-width: 574.375px;" role="graphics-document document" aria-roledescription="pie"><style>#m196{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#m196 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#m196 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#m196 .error-icon{fill:#552222;}#m196 .error-text{fill:#552222;stroke:#552222;}#m196 .edge-thickness-normal{stroke-width:1px;}#m196 .edge-thickness-thick{stroke-width:3.5px;}#m196 .edge-pattern-solid{stroke-dasharray:0;}#m196 .edge-thickness-invisible{stroke-width:0;fill:none;}#m196 .edge-pattern-dashed{stroke-dasharray:3;}#m196 .edge-pattern-dotted{stroke-dasharray:2;}#m196 .marker{fill:#333333;stroke:#333333;}#m196 .marker.cross{stroke:#333333;}#m196 svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#m196 p{margin:0;}#m196 .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#m196 .pieCircle.highlighted{scale:1.05;opacity:1;}#m196 .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#m196 .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#m196 .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#m196 .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#m196 .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#m196 .node .neo-node{stroke:#9370DB;}#m196 [data-look="neo"].node rect,#m196 [data-look="neo"].cluster rect,#m196 [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m196 [data-look="neo"].swimlane.cluster rect{filter:none;}#m196 [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#m196 [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m196 [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#m196 [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m196 [data-look="neo"].node circle .state-start{fill:#000000;}#m196 [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m196 [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#m196 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,1,1,-89.124,162.117L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M-89.124,162.117A185,185,0,0,1,-78.769,-167.393L0,0Z" fill="#ffffde" class="pieCircle"></path><path d="M-78.769,-167.393A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"></path><text transform="translate(134.39091360659756,34.50572184412362)" class="slice" style="text-anchor: middle;">58%</text><text transform="translate(-138.68153525074524,-4.358242822090382)" class="slice" style="text-anchor: middle;">35%</text><text transform="translate(-30.267374743770134,-135.40845071900122)" class="slice" style="text-anchor: middle;">7%</text></g><text x="0" y="-200" class="pieTitleText">Device Usage Statistics</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"></rect><text x="22" y="14">Mobile</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"></rect><text x="22" y="14">Desktop</text></g><g class="legend"
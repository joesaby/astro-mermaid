<svg id="merman" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 657.01 450" style="max-width: 657.01px;" role="graphics-document document" aria-roledescription="pie"><style>#merman{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#merman .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#merman .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#merman .error-icon{fill:#552222;}#merman .error-text{fill:#552222;stroke:#552222;}#merman .edge-thickness-normal{stroke-width:1px;}#merman .edge-thickness-thick{stroke-width:3.5px;}#merman .edge-pattern-solid{stroke-dasharray:0;}#merman .edge-thickness-invisible{stroke-width:0;fill:none;}#merman .edge-pattern-dashed{stroke-dasharray:3;}#merman .edge-pattern-dotted{stroke-dasharray:2;}#merman .marker{fill:#333333;stroke:#333333;}#merman .marker.cross{stroke:#333333;}#merman svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#merman p{margin:0;}#merman .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#merman .pieCircle.highlighted{scale:1.05;opacity:1;}#merman .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#merman .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#merman .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#merman .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#merman .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#merman .node .neo-node{stroke:#9370DB;}#merman [data-look="neo"].node rect,#merman [data-look="neo"].cluster rect,#merman [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].swimlane.cluster rect{filter:none;}#merman [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#merman [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#merman [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node circle .state-start{fill:#000000;}#merman [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,108.74027167410755,149.66814395936527L0,0Z" fill="#ECECFF" class="pieCircle"/><path d="M108.74027167410755,149.66814395936527A185,185,0,0,1,-175.9454555146034,57.1681439593653L0,0Z" fill="#ffffde" class="pieCircle"/><path d="M-175.9454555146034,57.1681439593653A185,185,0,0,1,-108.74027167410757,-149.66814395936527L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"/><path d="M-108.74027167410757,-149.66814395936527A185,185,0,0,1,-34.66554319835907,-181.7231413848074L0,0Z" fill="hsl(240, 100%, 86.2745098039%)" class="pieCircle"/><path d="M-34.66554319835907,-181.7231413848074A185,185,0,0,1,0,-185L0,0Z" fill="hsl(60, 100%, 63.5294117647%)" class="pieCircle"/><text transform="translate(131.95909163595255,-42.87610796952396)" class="slice" style="text-anchor: middle;">40%</text><text transform="translate(-42.876107969523936,131.95909163595257)" class="slice" style="text-anchor: middle;">30%</text><text transform="translate(-131.95909163595257,-42.87610796952393)" class="slice" style="text-anchor: middle;">20%</text><text transform="translate(-55.10426982557577,-127.33845431365239)" class="slice" style="text-anchor: middle;">7%</text><text transform="translate(-13.057528472943822,-138.13422258867735)" class="slice" style="text-anchor: middle;">3%</text></g><text x="0" y="-200" class="pieTitleText">Sales Distribution by Region</text><g class="legend" transform="translate(216,-55)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"/><text x="22" y="14">North America</text></g><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"/><text x="22" y="14">Europe</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"/><text x="22" y="14">Asia Pacific</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(185, 185, 255); stroke: rgb(185, 185, 255);"/><text x="22" y="14">Latin America</text></g><g class="legend" transform="translate(216,33)"><rect width="18" height="18" style="fill: rgb(255, 255, 69); stroke: rgb(255, 255, 69);"/><text x="22" y="14">Middle East &amp; Africa</text></g></g></svg>

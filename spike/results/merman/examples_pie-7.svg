e;">25%</text><text transform="translate(-123.62715523113603,62.99118183886213)" class="slice" style="text-anchor: middle;">15%</text><text transform="translate(-129.0064874169949,-51.077281684998994)" class="slice" style="text-anchor: middle;">12%</text><text transform="translate(-74.34596780333585,-117.15049966340455)" class="slice" style="text-anchor: middle;">8%</text><text transform="translate(-21.705282024332067,-137.04175725757534)" class="slice" style="text-anchor: middle;">5%</text></g><text x="0" y="-200" class="pieTitleText">Technology Stack in Projects</text><g class="legend" transform="translate(216,-66)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"/><text x="22" y="14">JavaScript/TypeScript</text></g><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"/><text x="22" y="14">Python</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"/><text x="22" y="14">Java</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(185, 185, 255); stroke: rgb(185, 185, 255);"/><text x="22" y="14">C#/.NET</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(255, 255, 69); stroke: rgb(255, 255, 69);"/><text x="22" y="14">Go</text></g><g class="legend" transform="translate(216,44)"><rect width="18" height="18" style="fill: rgb(215, 255, 134); stroke: rgb(215, 255, 134);"/><text x="22" y="14">Others</text></g></g></svg>

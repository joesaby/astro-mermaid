<svg id="merman" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 568.1 450" style="max-width: 568.1px;" role="graphics-document document" aria-roledescription="pie"><style>#merman{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#merman .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#merman .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#merman .error-icon{fill:#552222;}#merman .error-text{fill:#552222;stroke:#552222;}#merman .edge-thickness-normal{stroke-width:1px;}#merman .edge-thickness-thick{stroke-width:3.5px;}#merman .edge-pattern-solid{stroke-dasharray:0;}#merman .edge-thickness-invisible{stroke-width:0;fill:none;}#merman .edge-pattern-dashed{stroke-dasharray:3;}#merman .edge-pattern-dotted{stroke-dasharray:2;}#merman .marker{fill:#333333;stroke:#333333;}#merman .marker.cross{stroke:#333333;}#merman svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#merman p{margin:0;}#merman .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#merman .pieCircle.highlighted{scale:1.05;opacity:1;}#merman .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#merman .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#merman .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#merman .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#merman .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#merman .node .neo-node{stroke:#9370DB;}#merman [data-look="neo"].node rect,#merman [data-look="neo"].cluster rect,#merman [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].swimlane.cluster rect{filter:none;}#merman [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#merman [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#merman [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node circle .state-start{fill:#000000;}#merman [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,-89.12442970881727,162.11673580811478L0,0Z" fill="#ECECFF" class="pieCircle"/><path d="M-89.12442970881727,162.11673580811478A185,185,0,0,1,-78.7691689395385,-167.3930047062136L0,0Z" fill="#ffffde" class="pieCircle"/><path d="M-78.7691689395385,-167.3930047062136A185,185,0,0,1,0,-185L0,0Z" fill="hsl(80, 100%, 56.2745098039%)" class="pieCircle"/><text transform="translate(134.39091360659756,34.50572184412358)" class="slice" style="text-anchor: middle;">58%</text><text transform="translate(-138.68153525074527,-4.358242822090251)" class="slice" style="text-anchor: middle;">35%</text><text transform="translate(-30.267374743770386,-135.40845071900117)" class="slice" style="text-anchor: middle;">7%</text></g><text x="0" y="-200" class="pieTitleText">Device Usage Statistics</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(236, 236, 255); stroke: rgb(236, 236, 255);"/><text x="22" y="14">Mobile</text></g><g class="legend" transform="translate(216,-11)"><rect width="18" height="18" style="fill: rgb(255, 255, 222); stroke: rgb(255, 255, 222);"/><text x="22" y="14">Desktop</text></g><g class="legend" transform="translate(216,11)"><rect width="18" height="18" style="fill: rgb(181, 255, 32); stroke: rgb(181, 255, 32);"/><text x="22" y="14">Tablet</text></g></g></svg>
